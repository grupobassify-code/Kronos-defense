<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#312E81" />
    </radialGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C7D2FE" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
  </defs>

  <!-- Base Badge Background -->
  <rect width="256" height="256" rx="28" fill="url(#bgGrad)" />
  <rect x="4" y="4" width="248" height="248" rx="24" fill="none" stroke="#818CF8" stroke-width="3" opacity="0.6" />

  
      <!-- Clockwork Chrono Dial -->
      <circle cx="128" cy="128" r="105" fill="none" stroke="#818CF8" stroke-width="4" stroke-dasharray="12, 8" />
      <!-- Roman Numerals ticks -->
      <line x1="128" y1="35" x2="128" y2="45" stroke="#C7D2FE" stroke-width="3" />
      <line x1="221" y1="128" x2="211" y2="128" stroke="#C7D2FE" stroke-width="3" />
      <line x1="128" y1="221" x2="128" y2="211" stroke="#C7D2FE" stroke-width="3" />
      <line x1="35" y1="128" x2="45" y2="128" stroke="#C7D2FE" stroke-width="3" />
      <!-- Clock Hands -->
      <line x1="128" y1="128" x2="175" y2="105" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" />
      <line x1="128" y1="128" x2="128" y2="70" stroke="#C7D2FE" stroke-width="3" stroke-linecap="round" />
      <!-- Chrono Hood & Visor -->
      <path d="M84 95 C84 55, 172 55, 172 95 C172 150, 155 188, 128 195 C101 188, 84 150, 84 95 Z" fill="#312E81" stroke="#818CF8" stroke-width="4" />
      <rect x="94" y="108" width="68" height="24" rx="6" fill="#0F172A" stroke="#818CF8" stroke-width="2" />
      <path d="M100 120 Q128 108 156 120" stroke="#67E8F9" stroke-width="3" fill="none" filter="drop-shadow(0 0 8px #67E8F9)" />
      <!-- Pocket Hourglass in Hand -->
      <polygon points="120,175 136,175 120,205 136,205" fill="#818CF8" stroke="#F59E0B" stroke-width="2" />
    
</svg>