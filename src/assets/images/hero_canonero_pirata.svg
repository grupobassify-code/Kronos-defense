      <stop offset="0%" stop-color="#451A03" />
      <stop offset="100%" stop-color="#0F172A" />
    </radialGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
  </defs>

  <!-- Base Badge Background -->
  <rect width="256" height="256" rx="28" fill="url(#bgGrad)" />
  <rect x="4" y="4" width="248" height="248" rx="24" fill="none" stroke="#B45309" stroke-width="3" opacity="0.6" />

  
      <!-- Jolly Roger Compass & Wheel -->
      <circle cx="128" cy="128" r="105" fill="none" stroke="#B45309" stroke-width="4" stroke-dasharray="18, 12" />
