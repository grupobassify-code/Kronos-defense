      <path d="M128 40 L128 75" stroke="#F59E0B" stroke-width="3" />
      <circle cx="128" cy="62" r="8" fill="#DC2626" />
      <!-- Pirate Face & Eyepatch -->
      <path d="M96 100 C96 90, 160 90, 160 100 C160 145, 146 170, 128 174 C110 170, 96 145, 96 100 Z" fill="#FED7AA" />
