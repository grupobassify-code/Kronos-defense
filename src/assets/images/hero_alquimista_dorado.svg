    </linearGradient>
  </defs>

  <!-- Base Badge Background -->
  <rect width="256" height="256" rx="28" fill="url(#bgGrad)" />
  <rect x="4" y="4" width="248" height="248" rx="24" fill="none" stroke="#EAB308" stroke-width="3" opacity="0.6" />

  
      <!-- Golden Coin Radiance -->
